version: 1.0.1
homepage: https://github.com/tuan1996v2/name_screen_flutter
repository: https://github.com/tuan1996v2/name_screen_flutter

environment:
  sdk: ">=2.18.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
